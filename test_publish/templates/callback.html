<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Account - San As CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #1e293b;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 420px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Connecting your account...</h2>
        <p style="color: #64748b; font-size: 0.95rem; margin-top: 8px;">Finalizing secure authentication and preparing your software license.</p>
    </div>

    <script>
        const supaUrl = "{{ supabase_config.supabase_url }}";
        const supaKey = "{{ supabase_config.supabase_anon_key }}";

        async function processAuth() {
            if (supaUrl && supaKey && window.supabase) {
                try {
                    const supabase = window.supabase.createClient(supaUrl, supaKey);
                    const { data, error } = await supabase.auth.getSession();
                    
                    if (data && data.session && data.session.user) {
                        const user = data.session.user;
                        const response = await fetch('/api/auth/session-sync', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: user.email,
                                first_name: user.user_metadata?.full_name?.split(' ')[0] || user.user_metadata?.first_name || 'User',
                                last_name: user.user_metadata?.full_name?.split(' ')[1] || user.user_metadata?.last_name || ''
                            })
                        });
                        const resData = await response.json();
                        window.location.href = resData.redirect_url || '/verify-phone';
                        return;
                    }
                } catch (e) {
                    console.warn("Auth sync notice:", e);
                }
            }
            window.location.href = '/verify-phone';
        }
        processAuth();
    </script>
</body>
</html>
